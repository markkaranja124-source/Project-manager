<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manager Sign Up - Waiter Attendance Register</title>
  <meta name="description" content="Create Executive Manager Account">
  <meta name="theme-color" content="#0A2540">
  <link rel="stylesheet" href="styles.css?v=2.1">
  <style>
    /* Dedicated Professional Sign-up Layout */
    .auth-wrapper {
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .auth-card {
      background: var(--c-white);
      border: 2px solid var(--c-navy-primary);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      padding: 32px 28px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--c-navy-subtle);
      padding-bottom: 18px;
    }

    .auth-brand-icon {
      width: 48px;
      height: 48px;
      background: var(--c-navy-primary);
      color: var(--c-white);
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      border: 1px solid var(--c-navy-accent);
    }

    .auth-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: var(--c-navy-primary);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .auth-subtitle {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--c-gray-dark);
      text-transform: uppercase;
    }

    .auth-feedback {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 20px;
      display: none;
      border-left: 4px solid;
    }

    .auth-feedback.error {
      display: block;
      background: #FEE2E2;
      border-color: #DC2626;
      color: #991B1B;
    }

    .auth-feedback.success {
      display: block;
      background: #DCFCE7;
      border-color: #16A34A;
      color: #166534;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--c-navy-primary);
      margin-bottom: 6px;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: stretch;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--c-black);
      background: var(--c-gray-light);
      border: 1px solid var(--c-gray-border);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .form-input:focus {
      border-color: var(--c-navy-primary);
      background: var(--c-white);
      box-shadow: inset 0 0 0 1px var(--c-navy-primary);
    }

    .input-toggle-btn {
      background: var(--c-gray-surface);
      border: 1px solid var(--c-gray-border);
      border-left: none;
      padding: 0 14px;
      cursor: pointer;
      color: var(--c-gray-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .input-toggle-btn:hover {
      background: var(--c-navy-subtle);
      color: var(--c-navy-primary);
    }

    .field-error-msg {
      font-size: 11px;
      color: #DC2626;
      font-weight: 700;
      margin-top: 4px;
      display: none;
    }

    .btn-submit-auth {
      width: 100%;
      height: 46px;
      background: var(--c-navy-primary);
      color: var(--c-white);
      border: 1px solid var(--c-navy-dark);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      transition: background 0.15s, transform 0.05s;
    }

    .btn-submit-auth:hover:not(:disabled) {
      background: var(--c-navy-light);
    }

    .btn-submit-auth:active:not(:disabled) {
      background: var(--c-navy-dark);
      transform: scale(0.99);
    }

    .btn-submit-auth:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-switch-link {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--c-gray-dark);
    }

    .auth-switch-link a {
      color: var(--c-navy-accent);
      text-decoration: none;
      font-weight: 800;
      border-bottom: 1px solid var(--c-navy-accent);
      padding-bottom: 1px;
      margin-left: 4px;
    }

    .auth-switch-link a:hover {
      color: var(--c-navy-primary);
      border-color: var(--c-navy-primary);
    }

    .auth-footer-info {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--c-gray-border);
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--c-gray-dark);
      text-transform: uppercase;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
      color: var(--c-navy-accent);
      font-size: 10px;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Card Header -->
      <div class="auth-header">
        <div class="auth-brand-icon">AR</div>
        <h1 class="auth-title">Executive Register</h1>
        <p class="auth-subtitle">Manager Account Registration</p>
      </div>

      <!-- Feedback Alert Box -->
      <div id="signup-feedback" class="auth-feedback" role="alert" aria-live="polite"></div>

      <!-- Sign Up Form -->
      <form id="form-manager-signup" novalidate autocomplete="on">

        <!-- Name Field -->
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <div class="input-group">
            <input 
              type="text" 
              class="form-input" 
              id="signup-name" 
              name="name" 
              required 
              placeholder="e.g. Alexander Cole"
              autocomplete="name"
            >
          </div>
          <div class="field-error-msg" id="name-error-msg">Please enter your full name.</div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label class="form-label" for="signup-email">Manager Email Address</label>
          <div class="input-group">
            <input 
              type="email" 
              class="form-input" 
              id="signup-email" 
              name="email" 
              required 
              placeholder="alexander@restaurant.com"
              autocomplete="email"
              spellcheck="false"
            >
          </div>
          <div class="field-error-msg" id="email-error-msg">Please enter a valid email address.</div>
        </div>

        <!-- Password Field with Show/Hide -->
        <div class="form-group">
          <label class="form-label" for="signup-password">Create Password (Min. 6 Characters)</label>
          <div class="input-group">
            <input 
              type="password" 
              class="form-input" 
              id="signup-password" 
              name="password" 
              required 
              placeholder="••••••••••••"
              autocomplete="new-password"
            >
            <button 
              type="button" 
              class="input-toggle-btn" 
              id="btn-toggle-pwd" 
              title="Show or hide password" 
              aria-label="Show password"
            >
              <svg id="icon-eye-show-pwd" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="icon-eye-hide-pwd" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="field-error-msg" id="password-error-msg">Password must be at least 6 characters.</div>
        </div>

        <!-- Confirm Password Field with Show/Hide -->
        <div class="form-group">
          <label class="form-label" for="signup-confirm-password">Confirm Password</label>
          <div class="input-group">
            <input 
              type="password" 
              class="form-input" 
              id="signup-confirm-password" 
              name="confirm-password" 
              required 
              placeholder="••••••••••••"
              autocomplete="new-password"
            >
            <button 
              type="button" 
              class="input-toggle-btn" 
              id="btn-toggle-cpwd" 
              title="Show or hide confirm password" 
              aria-label="Show confirm password"
            >
              <svg id="icon-eye-show-cpwd" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="icon-eye-hide-cpwd" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="field-error-msg" id="confirm-password-error-msg">Passwords do not match.</div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit-auth" id="btn-signup-submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          <span id="btn-signup-text">Register Manager Account</span>
        </button>

      </form>

      <!-- Switch to Sign In -->
      <div class="auth-switch-link">
        Already registered? <a href="/login.html">Sign in here</a>
      </div>

      <!-- Security Notice Footer -->
      <div class="auth-footer-info">
        <div class="security-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Bcrypt Encrypted Credential Storage
        </div>
        <div>Strictly For Authorized Management Only</div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const form = document.getElementById('form-manager-signup');
      const inputName = document.getElementById('signup-name');
      const inputEmail = document.getElementById('signup-email');
      const inputPassword = document.getElementById('signup-password');
      const inputConfirmPassword = document.getElementById('signup-confirm-password');

      const btnTogglePwd = document.getElementById('btn-toggle-pwd');
      const iconShowPwd = document.getElementById('icon-eye-show-pwd');
      const iconHidePwd = document.getElementById('icon-eye-hide-pwd');

      const btnToggleCPwd = document.getElementById('btn-toggle-cpwd');
      const iconShowCPwd = document.getElementById('icon-eye-show-cpwd');
      const iconHideCPwd = document.getElementById('icon-eye-hide-cpwd');

      const feedback = document.getElementById('signup-feedback');
      const nameError = document.getElementById('name-error-msg');
      const emailError = document.getElementById('email-error-msg');
      const passwordError = document.getElementById('password-error-msg');
      const confirmPasswordError = document.getElementById('confirm-password-error-msg');

      const btnSubmit = document.getElementById('btn-signup-submit');
      const btnText = document.getElementById('btn-signup-text');

      // Show/Hide Password Toggle
      btnTogglePwd.addEventListener('click', function () {
        const isPassword = inputPassword.type === 'password';
        inputPassword.type = isPassword ? 'text' : 'password';
        iconShowPwd.style.display = isPassword ? 'none' : 'block';
        iconHidePwd.style.display = isPassword ? 'block' : 'none';
      });

      // Show/Hide Confirm Password Toggle
      btnToggleCPwd.addEventListener('click', function () {
        const isPassword = inputConfirmPassword.type === 'password';
        inputConfirmPassword.type = isPassword ? 'text' : 'password';
        iconShowCPwd.style.display = isPassword ? 'none' : 'block';
        iconHideCPwd.style.display = isPassword ? 'block' : 'none';
      });

      function showFeedback(message, type) {
        feedback.className = 'auth-feedback ' + type;
        feedback.textContent = message;
      }

      function clearFeedback() {
        feedback.className = 'auth-feedback';
        feedback.style.display = 'none';
        feedback.textContent = '';
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      // Clear errors on typing
      [inputName, inputEmail, inputPassword, inputConfirmPassword].forEach(input => {
        input.addEventListener('input', () => {
          nameError.style.display = 'none';
          emailError.style.display = 'none';
          passwordError.style.display = 'none';
          confirmPasswordError.style.display = 'none';
          clearFeedback();
        });
      });

      // Form submission
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearFeedback();
        nameError.style.display = 'none';
        emailError.style.display = 'none';
        passwordError.style.display = 'none';
        confirmPasswordError.style.display = 'none';

        const name = inputName.value.trim();
        const email = inputEmail.value.trim();
        const password = inputPassword.value;
        const confirmPassword = inputConfirmPassword.value;

        let hasError = false;

        if (!name || name.length < 2) {
          nameError.textContent = 'Please enter your full name (minimum 2 characters).';
          nameError.style.display = 'block';
          hasError = true;
        }

        if (!email) {
          emailError.textContent = 'Email address is required.';
          emailError.style.display = 'block';
          hasError = true;
        } else if (!isValidEmail(email)) {
          emailError.textContent = 'Please enter a valid email address (e.g. name@domain.com).';
          emailError.style.display = 'block';
          hasError = true;
        }

        if (!password || password.length < 6) {
          passwordError.textContent = 'Password must be at least 6 characters.';
          passwordError.style.display = 'block';
          hasError = true;
        }

        if (password !== confirmPassword) {
          confirmPasswordError.textContent = 'Passwords do not match.';
          confirmPasswordError.style.display = 'block';
          hasError = true;
        }

        if (hasError) return;

        btnSubmit.disabled = true;
        btnText.textContent = 'CREATING ACCOUNT...';

        try {
          const response = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name, email, password })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            showFeedback('Manager account created successfully! Redirecting to login...', 'success');
            setTimeout(() => {
              window.location.replace('/login.html?registered=1');
            }, 1200);
          } else {
            showFeedback(data.message || 'Registration could not be completed.', 'error');
          }
        } catch (err) {
          showFeedback('Network error communicating with registration service.', 'error');
        } finally {
          btnSubmit.disabled = false;
          btnText.textContent = 'Register Manager Account';
        }
      });

    })();
  </script>
</body>
</html>
