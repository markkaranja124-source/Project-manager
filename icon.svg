<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Luxury Navy / Obsidian Gradient -->
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>

    <!-- Luxury Gold Gradient (Exact Match to login.html) -->
    <linearGradient id="crestGoldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Inner White-to-Gold Specular Light -->
    <linearGradient id="innerGlowG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle Radial Glow Behind Shield -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.22)"/>
      <stop offset="65%" stop-color="rgba(245, 158, 11, 0.05)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="pwaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Full Bleed Background for Android Maskable & iOS Icons -->
  <rect width="512" height="512" fill="url(#pwaBgGrad)"/>

  <!-- Elegant Inset Gold Filigree Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#crestGoldG)" stroke-width="3" opacity="0.35"/>
  <rect x="34" y="34" width="444" height="444" rx="86" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.2"/>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="256" cy="256" r="190" fill="url(#centerGlow)"/>

  <!-- Scaled Crest & Capital G from login.html -->
  <g transform="translate(68, 62) scale(8.55)" filter="url(#pwaShadow)">
    <!-- Outer Shield -->
    <path d="M22 3.5L5 10.5V20.5C5 31 12.5 39.5 22 42.5C31.5 39.5 39 31 39 20.5V10.5L22 3.5Z" stroke="url(#crestGoldG)" stroke-width="2.2" fill="rgba(15, 23, 42, 0.96)"/>
    
    <!-- Inner Shield Accent -->
    <path d="M22 7.5L8.5 13.2V20.5C8.5 28.8 14.5 35.8 22 38.3C29.5 35.8 35.5 28.8 35.5 20.5V13.2L22 7.5Z" stroke="#F59E0B" stroke-width="0.8" opacity="0.45"/>
    
    <!-- Stylish Capital G Monogram -->
    <path d="M28.5 16.5C27.2 14.2 24.8 12.8 22 12.8C17.3 12.8 13.5 16.6 13.5 21.8C13.5 27 17.3 30.8 22.2 30.8C26.8 30.8 29.8 27.8 30.2 23.5H22V20.2H33.2C33.4 21.1 33.5 22.1 33.5 23.2C33.5 28.8 29.2 33.8 22.2 33.8C15.4 33.8 10 28.5 10 21.8C10 15.1 15.4 9.8 22.2 9.8C26.4 9.8 30 11.8 32.2 15L28.5 16.5Z" fill="url(#crestGoldG)"/>
    
    <!-- Inner White/Gold Bevel Highlight -->
    <path d="M28.8 22.8H23.5V21.5H31.5C31.3 26 28.2 29.8 22.2 29.8C17.2 29.8 13.2 26.2 13.2 21.8C13.2 17.4 17.2 13.8 22 13.8C25.2 13.8 27.6 15.2 29.2 17.2L28 18C26.6 16.2 24.5 15 22 15C18 15 14.6 18 14.6 21.8C14.6 25.6 18 28.6 22.2 28.6C26 28.6 28.6 26 28.8 22.8Z" fill="url(#innerGlowG)"/>
  </g>
</svg>